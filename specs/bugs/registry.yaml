bugs:
  - bug_id: BUG-2026-09-18T174200
    date: "2026-09-18"
    severity: medium
    priority: high
    scope: cookbook-settings
    summary: >-
      The HF token input's save-on-change handler routed through the generic
      debounced state sync, which unconditionally strips hfToken before every
      POST (correct for that channel, wrong for the deliberate save action) —
      the token was never actually sent to the backend, only held in memory.
    file: specs/bugs/BUG-2026-09-18T174200-cookbook-hf-token-never-persisted.md
    status: resolved
    files_changed:
      - static/js/cookbookRunning.js
      - static/js/cookbook.js
    approach: >-
      Added _syncHfTokenToServer() which builds the same full state payload
      but does not strip hfToken, sent immediately from the token input's
      change handler instead of going through the stripped debounced sync.

  - bug_id: BUG-2026-09-18T174201
    date: "2026-09-18"
    severity: high
    priority: high
    scope: document-library
    summary: >-
      Two independent destructive bugs were found: opening an email/Nextcloud
      attachment bulk-soft-deleted every document (removed), and switching to
      a new document could save stale empty editor DOM into the previous tab,
      then auto-DELETE that real previous document. The latter exactly matched
      the recurrence: documents visible at boot, then only the newly created
      document remains. Tab switching no longer deletes documents.
    file: specs/bugs/BUG-2026-09-18T174201-library-documents-look-lost-on-restart.md
    status: resolved_pending_live_confirmation
    files_changed:
      - routes/email_routes.py
      - static/js/document.js
      - static/js/documentLibrary.js
      - tests/test_document_tab_switch_never_deletes_js.py
    approach: >-
      Remove the email attachment bulk update and all destructive behavior
      from switchToDoc; retain DELETE only in explicit close/discard flow,
      with a static source regression test proving the boundary.

  - bug_id: BUG-2026-09-18T174202
    date: "2026-09-18"
    severity: low
    priority: medium
    scope: cookbook-dependencies
    summary: >-
      First fix (SSH-probe module fallback) fixed diffusers but not
      sam_mask, because sam_mask has target:"local" and never reaches that
      code path at all. Real bug: the local-target check tried
      importlib.import_module("sam_mask") — not a real module, a synthetic
      bundle name for torch+transformers — so it always failed regardless
      of whether torch/transformers were actually installed.
    file: specs/bugs/BUG-2026-09-18T174202-cookbook-deps-sam-mask-diffusers-false-red.md
    status: resolved
    files_changed:
      - routes/shell_routes.py
    approach: >-
      Added an explicit sam_mask branch in the local-target package loop
      checking torch+transformers importability/version directly instead of
      import_module("sam_mask"); kept the SSH-probe fallback fix too.
  - bug_id: BUG-2026-09-18T231000
    date: "2026-09-18"
    severity: high
    priority: high
    scope: mcp-document-routing
    summary: >-
      Explicit Nextcloud MCP routing omitted the local create_document schema
      and an invalid learned skill named nonexistent importer tools, causing
      chat pastes and model/session loops instead of Library document creation.
    file: specs/bugs/BUG-2026-09-18T231000-nextcloud-library-transfer.md
    status: resolved
    files_changed:
      - src/agent_loop.py
      - data/skills/general/import-nextcloud-document-into-odysseus/SKILL.md
      - data/skills/general/import-nextcloud-document-to-odysseus-and-critique/SKILL.md
      - tests/test_mcp_document_transfer_routing.py
    approach: >-
      Preserve create_document through every MCP narrowing path, prevent broad
      admin schema injection, generalize the skill-narrowing carve-out to
      _sk_local_toolsets, then compute _mcp_document_transfer_tools once
      unconditionally and union it into all 3 narrowing reassignment sites
      (explicit-server, follow-up, skill-triggered) so a second matched skill
      with no local toolset of its own can no longer silently drop it.
    risk_level: low
    commit_message: "fix(mcp): transfer Nextcloud files into Library documents"
  - bug_id: BUG-2026-09-18T225258
    date: "2026-09-18"
    severity: medium
    priority: high
    scope: cookbook-gpu-runtime
    summary: >-
      Odysseus Uvicorn owns 1854 MiB of actual CUDA VRAM with no visible
      standalone model server. Investigation must identify and prevent the
      implicit or cached GPU initializer rather than merely hiding it in
      Cookbook's preflight warning.
    file: specs/bugs/BUG-2026-09-18T225258-odysseus-idle-cuda-vram.md
    status: verified_fix_pending_suite
    files_changed:
      - src/embeddings.py
      - routes/embedding_routes.py
      - tests/test_embeddings.py
      - tests/test_embedding_cache_confinement.py
    approach: Explicitly force CPU FastEmbed sessions in the web process.
    risk_level: low
    commit_message: "fix(embeddings): keep local FastEmbed off the serving GPU"
  - bug_id: BUG-2026-09-18T095530
    date: "2026-09-18"
    severity: high
    priority: high
    scope: agent-tool-selection
    summary: >-
      Bare "retry" after a failed MCP tool call was classified low-signal
      (no domain keywords), dropping the tool from the model's schema list
      and causing Qwen3-14B to loop on an unrelated tool before hallucinating
      a nonexistent function name. Root cause: retry-continuation detection
      was gated on a Cookbook-only keyword list. Fixed by recognizing any
      retry phrase after an actually-failed tool call (any domain) as a
      continuation, and by always surfacing a non-empty MCP error detail.
    file: specs/bugs/BUG-2026-09-18T095530-mcp-retry-loop.md
    status: resolved
  - bug_id: BUG-2026-09-18T101500
    date: "2026-09-18"
    severity: medium
    priority: medium
    scope: agent-tool-selection
    summary: >-
      A hallucinated or typo'd tool name fell through to a bare
      "Unknown tool: X" error with no hint toward the real tool name,
      giving the model (especially a small one) no way to self-correct
      within the turn. Fixed by fuzzy-matching the attempted name against
      known builtin and MCP-qualified tool names (difflib) and appending
      a "did you mean" suggestion when a close match exists.
    file: specs/bugs/BUG-2026-09-18T101500-hallucinated-tool-no-suggestion.md
    status: resolved
  - bug_id: BUG-2026-09-18T105700
    date: "2026-09-18"
    severity: medium
    priority: high
    scope: agent-tool-selection
    summary: >-
      A regression in the earlier Nextcloud tool-selection fix (see
      BUG-2026-09-18T094500) scored list-vs-read intent against the entire
      merged multi-turn continuation query instead of the latest turn, so an
      earlier "list files inside Work" turn permanently blocked
      nc_webdav_read_file on every later turn, causing Qwen to falsely claim
      no file-content tool was available. Fixed by scoping the disambiguation
      to the latest turn's own words.
    file: specs/bugs/BUG-2026-09-18T105700-nextcloud-stale-list-intent-blocks-read.md
    status: resolved
  - bug_id: BUG-2026-09-18T094500
    date: "2026-09-18"
    severity: high
    priority: high
    scope: agent-tool-selection
    summary: >-
      A skill naming a connected remote MCP server (Nextcloud) contributed no
      real callable tool schema when the toolset name wasn't a static tool,
      so the model tried to route the MCP tool name through the model-router
      (pipeline) tool, got "Model not found", then created a bogus scheduled
      task to "deploy" an MCP server that was already connected and working.
      Fixed by resolving non-static requires_toolsets via
      get_tools_for_explicit_server_reference and narrowing tool selection
      to the actual MCP schemas found.
    file: specs/bugs/BUG-2026-09-18T094500-nextcloud-bogus-task-creation.md
    status: resolved
  - bug_id: BUG-2026-09-18T032742
    date: "2026-09-18"
    severity: high
    priority: high
    scope: agent-tool-selection
    summary: >-
      Seerr's search-then-request workflow could surface seerr_search
      without seerr_requests (3-tool lexical ranking cap left the request
      tool out), leaving the model unable to complete a media request and
      prone to wandering into large Discover-page responses. Fixed by
      pairing *_search with *_requests explicitly whenever a request-shaped
      query is detected.
    file: specs/bugs/BUG-2026-09-18T032742-seerr-missing-request-tool.md
    status: resolved
  - bug_id: BUG-2026-09-18T090000
    date: "2026-09-18"
    severity: high
    priority: high
    scope: agent-skills
    summary: >-
      Qwen invented a placeholder Seerr mediaId (12345) instead of searching
      first, and a separate bad custom skill taught the wrong operation name
      (seerr_post_request) and manual URL-encoding of the search query.
      Fixed with a new skill (request-media-from-seerr) enforcing search-then-
      select-then-request with no invented IDs, no URL-encoding, and the
      correct seerr_create_request operation.
    file: specs/bugs/BUG-2026-09-18T090000-seerr-hallucinated-media-id.md
    status: resolved
  - bug_id: BUG-2026-09-18T033314
    date: "2026-09-18"
    severity: high
    priority: medium
    scope: calendar-tasks-notes
    summary: >-
      No default-calendar preference existed, so implicit event creation
      could land in a read-only CalDAV collection returned first by the
      server; Quick Add could also fail silently with no UI feedback. Fixed
      with a preference-ordered _preferred_calendar() resolver, an explicit
      "calendar" field in Quick Add's model-parse schema, async/await error
      surfacing in the UI, and a Settings default-calendar picker.
    file: specs/bugs/BUG-2026-09-18T033314-calendar-default-and-quick-add.md
    status: resolved
  - bug_id: BUG-2026-09-18T033327
    date: "2026-09-18"
    severity: medium
    priority: medium
    scope: memory
    summary: >-
      Memory Tidy's per-attempt LLM timeout (120s) was too short for local
      reasoning models (e.g. Qwen3-14B-Q5) to finish a full rewrite pass,
      causing every attempt to 502 even when the model would have finished
      given more time. Raised to 300s.
    file: specs/bugs/BUG-2026-09-18T033327-memory-tidy-timeout.md
    status: resolved
  - bug_id: BUG-2026-09-18T080107
    date: "2026-09-18"
    severity: medium
    priority: medium
    scope: mcp
    summary: >-
      Remote MCP servers requiring a static auth header (e.g. a Portainer
      MCP gateway token) had no way to authenticate — only OAuth was
      supported. Added an encrypted request_headers column and threaded
      static headers through the SSE/HTTP connect paths, bypassing OAuth
      discovery when headers are supplied.
    file: specs/bugs/BUG-2026-09-18T080107-mcp-static-auth-headers.md
    status: resolved
  - bug_id: BUG-2026-09-17T195822
    date: "2026-09-17"
    severity: medium
    priority: low
    scope: cookbook
    summary: >-
      Missing llama-server binary on PATH forced a fallback to an in-process
      GPU probe that permanently pinned a CUDA context in the main app
      process, which GPU-preflight then misreported as competing external
      VRAM load. Fixed with a Dockerfile PATH addition and a self-process
      tag excluded from the preflight "existing load" calculation.
    file: specs/bugs/BUG-2026-09-17T195822-cookbook-gpu-preflight-self-flag.md
    status: resolved
  - bug_id: BUG-2026-09-17T195822-ZOOM
    date: "2026-09-17"
    severity: medium
    priority: medium
    scope: frontend
    summary: >-
      The "Larger" text-size setting's CSS zoom splits getBoundingClientRect
      (post-zoom) from offsetWidth/style.* (pre-zoom) pixel spaces; code
      mixing the two rendered popups/dropdowns/dock/drag/resize ~1.25x too
      big or mispositioned. Fixed with a per-module _zoomRatio() conversion
      rolled out across three commits as more affected modules were found.
    file: specs/bugs/BUG-2026-09-17T195822-ui-zoom-position-math.md
    status: resolved
  - bug_id: BUG-2026-09-20T000000
    date: "2026-09-20"
    severity: high
    priority: high
    scope: host-infra
    summary: >-
      Qwen3-14B llama-server silently fell back to CPU after a host reboot
      reassigned NVIDIA device major numbers; the stale /etc/cdi/nvidia.yaml
      spec (3 days old) still pointed the container's device cgroup at the
      old /dev/nvidia-uvm major number, so cuInit failed with cudaErrorUnknown
      while nvidia-smi (NVML, unaffected devices) kept working. Reproduced
      identically in stock unrelated nvidia/cuda containers with zero
      Odysseus code involved -- exonerates the 41c87b54 Dockerfile/compose
      CUDA rework. No code fix; host command needed (sudo nvidia-ctk cdi
      generate --output=/etc/cdi/nvidia.yaml).
    file: specs/bugs/BUG-2026-09-20T000000-stale-cdi-spec-cpu-fallback.md
    status: resolved
